<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Box Ignia - preview</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4/dist/model-viewer.min.js"></script>
<style>body{margin:0;background:#faf7f2;font-family:system-ui;display:flex;flex-direction:column;align-items:center}
model-viewer{width:min(92vw,720px);height:80vh;--poster-color:transparent}
p{color:#777;font-size:14px}</style></head>
<body>
<model-viewer src="/3d/ignia_box.glb" alt="Box Ignia x Vivabox" camera-controls interaction-prompt="none" disable-pan
 shadow-intensity="0" exposure="0.95" environment-image="/3d/env_studio.hdr" environment-intensity="0.85" tone-mapping="neutral"
 camera-orbit="0deg 84deg 100%" min-camera-orbit="-Infinity 0deg 2%" max-camera-orbit="Infinity 180deg auto"
 style="filter:contrast(1.05) saturate(.95) drop-shadow(8px 12px 16px rgba(24,20,15,.3))"></model-viewer>
<p>Arrastra para girar la caja Ignia x Vivabox</p>
</body></html>
